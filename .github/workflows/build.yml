name: Build EXE with Nuitka

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install nuitka

    - name: Build EXE
      run: |
        # Собираем нативно, без консоли, в один файл
        python -m nuitka --onefile --windows-disable-console --assume-yes-for-downloads --output-dir=dist main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bank-vor-exe
        path: dist/main.exe
