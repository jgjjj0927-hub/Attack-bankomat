name: Build Bank-Vor Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name="bank-vor-builder" builder.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bank-vor-builder
        path: dist/bank-vor-builder.exe
